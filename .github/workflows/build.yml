name: build-profiles

# 営業圏プロファイル（電話帳）を1枚にまとめて配る。
# push のたびに検査 → 通ったものだけ Pages へ。検査で落ちれば**前の棚のまま**。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 棚の更新は1本ずつ。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策: 公式actionをコミットSHAで固定（タグ付け替え攻撃を防ぐ）
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # 🔴 ここが関所。1件でも問題があれば非0で止まり、配信ジョブへ進まない
      #    ＝棚は前回のまま温存される（中途半端に配って画面を壊さない）。
      #    ⚠️ CI にはアプリのソースが無いので「アプリが知らない営業圏キー」の
      #       突き合わせだけは省略される。そこは手元で build.py を回して見る。
      - run: python build.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
